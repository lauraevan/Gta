<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grand Theft Auti</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Arial Black", Arial, sans-serif; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- Loading screen ---------- */
  #loader {
    position: fixed; inset: 0; background: #0a0a0a; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff;
  }
  #loader h1 {
    font-size: 64px; letter-spacing: 2px; color: #ff8c1a;
    text-shadow: 4px 4px 0 #000, 0 0 30px rgba(255,140,26,0.6);
    transform: skewX(-6deg); font-weight: 900; text-align: center;
  }
  #loader .sub { color: #888; margin-top: 6px; font-size: 14px; letter-spacing: 4px; }
  #barWrap { width: 60%; max-width: 600px; height: 22px; border: 2px solid #ff8c1a; margin-top: 40px; background: #000; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg,#ff8c1a,#ffd000); transition: width 0.1s; }
  #loadMsg { margin-top: 14px; color: #ccc; font-size: 13px; letter-spacing: 2px; font-family: monospace; }
  #startBtn { margin-top: 30px; padding: 14px 50px; font-size: 22px; font-weight: 900; background: #ff8c1a; color:#000;
    border: none; cursor: pointer; transform: skewX(-6deg); display: none; }
  #startBtn:hover { background: #ffd000; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 100; color: #fff; font-family: "Arial Black", Arial, sans-serif; }
  .hudshadow { text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; }

  #topleft { position: absolute; top: 14px; left: 14px; }
  .barOuter { width: 200px; height: 18px; background: #3a0000; border: 2px solid #000; margin-bottom: 4px; position: relative; }
  .barInner { height: 100%; transition: width 0.15s; }
  #hpBar { background: linear-gradient(180deg,#5cff5c,#1a9e1a); }
  #armorBar { background: linear-gradient(180deg,#6cb6ff,#1a5f9e); width: 0%; }
  .barLabel { position: absolute; left: 6px; top: -1px; font-size: 12px; color:#fff; }
  #portrait { margin-top: 6px; border: 2px solid #000; background:#222; }

  #topright { position: absolute; top: 14px; right: 18px; text-align: right; }
  #stars { font-size: 30px; letter-spacing: 2px; }
  .star { color: #444; text-shadow: 1px 1px 0 #000; }
  .star.on { color: #ffd000; text-shadow: 0 0 8px #ffd000, 1px 1px 0 #000; }
  .star.flash { animation: starflash 0.4s infinite; }
  @keyframes starflash { 50% { color:#fff; } }
  #money { font-size: 30px; color: #4cff4c; margin-top: 4px; }
  #ammo { font-size: 22px; margin-top: 4px; color:#fff; }
  #ammo .wname { font-size: 13px; color:#bbb; display:block; }

  #botleft { position: absolute; bottom: 14px; left: 14px; }
  #minimap { width: 160px; height: 160px; border-radius: 50%; border: 3px solid #000; background: #243024; }
  #mmNorth { position:absolute; top:-2px; left:50%; transform:translateX(-50%); color:#ff5555; font-size:12px; }
  #mmZoom { position:absolute; bottom: 2px; left: 50%; transform: translateX(-50%); font-size: 10px; color:#fff; }

  #botcenter { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); text-align: center; }
  #vehName { font-size: 22px; color:#ffd000; opacity:0; transition: opacity 0.4s; }
  #speedBox { font-size: 16px; color:#fff; margin-top:4px; opacity:0; transition:opacity 0.3s; }

  #botright { position: absolute; bottom: 14px; right: 18px; text-align: right; }
  #weaponName { font-size: 16px; color:#fff; }
  #clock { font-size: 22px; color:#7cf; font-family: "Courier New", monospace; letter-spacing:2px; }

  #centerprompt { position: absolute; bottom: 32%; left: 50%; transform: translateX(-50%); text-align: center;
    font-size: 18px; color:#fff; opacity:0; transition: opacity 0.2s; }
  #objective { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); text-align: center;
    font-size: 20px; color:#ffd000; max-width: 70%; opacity:0; transition: opacity 0.3s; }
  #missionTimer { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); font-size: 26px; color:#ff5555; opacity:0; }

  #crosshair { position: absolute; top:50%; left:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%;
    background:#fff; box-shadow:0 0 4px #000; display:none; }
  #crosshair.locked { background:#ff3030; width:14px; height:14px; margin:-7px 0 0 -7px; }

  #damageFlash { position:absolute; inset:0; pointer-events:none; opacity:0;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(180,0,0,0.65) 100%); }
  #deathOverlay { position:fixed; inset:0; background:#600; opacity:0; z-index:200; pointer-events:none;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:60px; transition:opacity 0.5s; }

  #toast { position:absolute; top: 40%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7);
    padding:12px 30px; font-size:22px; color:#ffd000; opacity:0; transition:opacity 0.4s; }

  #bigmsg { position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); text-align:center;
    font-size:42px; color:#fff; opacity:0; transition: opacity 0.4s; text-shadow:3px 3px 0 #000; }

  #fps { position:absolute; top: 120px; right: 18px; font-family:monospace; font-size:12px; color:#9f9; }

  /* ---------- Weapon wheel ---------- */
  #weaponWheel { position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; }
  #weaponWheel canvas { background: rgba(0,0,0,0.3); border-radius:50%; }

  /* ---------- Shop / pause panels ---------- */
  .panel { position:fixed; inset:0; z-index:160; background:rgba(0,0,0,0.85); display:none;
    flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  .panel h2 { font-size:36px; color:#ff8c1a; margin-bottom:20px; }
  .panel .item { width:340px; padding:10px 18px; margin:4px; background:#222; border:2px solid #444; cursor:pointer;
    display:flex; justify-content:space-between; pointer-events:auto; }
  .panel .item:hover { background:#ff8c1a; color:#000; }
  .panel .hint { margin-top:20px; color:#999; }

  /* ---------- Touch controls ---------- */
  #touch { position:fixed; inset:0; z-index:90; pointer-events:none; display:none; }
  .tbtn { position:absolute; pointer-events:auto; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.4);
    border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; user-select:none; }
  #joyMove { left:30px; bottom:30px; width:120px; height:120px; }
  #joyMoveK { position:absolute; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.4); left:35px; top:35px; }
  #joyCam { right:30px; bottom:170px; width:100px; height:100px; }
  #joyCamK { position:absolute; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.4); left:28px; top:28px; }
  #btnFire { right:40px; bottom:40px; width:80px; height:80px; background:rgba(255,60,60,0.3); }
  #btnJump { right:140px; bottom:50px; width:60px; height:60px; }
  #btnEnter { right:40px; bottom:130px; width:60px; height:60px; }
</style>
</head>
<body>
<div id="game"></div>

  <h1>GRAND THEFT AUTI</h1>

<!-- HUD -->
<div id="hud">
  <div id="topleft">
    <div class="barOuter"><div id="hpBar" class="barInner" style="width:100%"></div><span class="barLabel hudshadow">HP</span></div>
    <div class="barOuter"><div id="armorBar" class="barInner"></div><span class="barLabel hudshadow">ARMOR</span></div>

  <div id="botleft">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================================================================
   GRAND THEFT AUTI — single-file Three.js open-world crime game
   =================================================================== */
'use strict';

// ---- Guard: ensure Three loaded ----
if (typeof THREE === 'undefined') {
  document.getElementById('loadMsg').textContent = 'ERROR: Three.js failed to load (network).';
}

// =================== GLOBAL STATE ===================
const G = {
  scene:null, camera:null, renderer:null, clock:null,
  player:null, vehicles:[], peds:[], police:[], bullets:[], pickups:[],
  buildings:[], buildingAABBs:[], roads:[], trafficLights:[], markers:[],
  particles:null, audio:null, world:null, mission:null,
  keys:{}, mouse:{x:0,y:0,down:false,right:false},
  time:8*3600, // seconds in day (start 8am)
  dayLength:600, // 10 min real = full day
  wanted:0, wantedGainFlash:0, lastSeenTimer:0,
  money:1000, displayMoney:1000,
  paused:false, started:false, dead:false,
  cameraMode:0, camOrbit:{theta:0,phi:0.4,dist:7}, camFov:60,
  aiming:false, lockTarget:null, wheelOpen:false, timeScale:1,
  hospitals:[], paySpray:[], safehouses:[], shops:[],
  gangZones:[], explosions:[],
  CITY:0, // city size in units
  sun:null, ambient:null, skyMat:null,
  bigmsgTimer:0, toastTimer:0, vehNameTimer:0,
  fpsAccum:0, fpsFrames:0, fpsDisplay:0,
};

// Colors
const PAL = {
  building:[0x8B3A3A,0x7A7A7A,0x4A8FA8,0xD4C5A9,0x1C2B35,0x6b5b4a,0x556070],
  road:0x1a1a1a, sidewalk:0xB0A090, park:0x3A6B35, water:0x2f4a55,
};

// =================== UTIL ===================
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;

// =================== AUDIO (Web Audio API, all procedural) ===================
class AudioEngine{
  constructor(){
    this.ctx=null; this.master=null; this.engineOsc=null; this.engineGain=null;
    this.sirenNodes=null; this.ambientNode=null;
  }
  init(){
    if(this.ctx) return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain(); this.master.gain.value=0.6; this.master.connect(this.ctx.destination);
      this.startAmbient();
    }catch(e){ console.warn('audio fail',e); }
  }
  noiseBuf(dur){
    const ctx=this.ctx, n=Math.floor(ctx.sampleRate*dur), buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return buf;
  }
  burst(dur,filterFreq,gain,type){
    if(!this.ctx) return;
    const ctx=this.ctx, src=ctx.createBufferSource(); src.buffer=this.noiseBuf(dur);
    const f=ctx.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=filterFreq||800; f.Q.value=1;
    const g=ctx.createGain(); g.gain.setValueAtTime(gain||0.4,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(); src.stop(ctx.currentTime+dur);
  }
  gunshot(type){
    if(!this.ctx) return;
    if(type==='shotgun'){ this.burst(0.18,420,0.6,'lowpass'); }
    else if(type==='rifle'){ this.burst(0.1,1100,0.45,'bandpass'); }
    else if(type==='smg'){ this.burst(0.05,1600,0.3,'bandpass'); }
    else if(type==='sniper'){ this.burst(0.25,700,0.6,'lowpass'); }
    else this.burst(0.08,1400,0.4,'bandpass');
  }
  punch(){ this.burst(0.06,500,0.4,'bandpass'); }
  footstep(){ this.burst(0.04,300,0.12,'lowpass'); }
  explosion(){
    if(!this.ctx) return;
    this.burst(0.05,2000,0.5,'highpass'); // crack
    const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(200,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+0.8);
    g.gain.setValueAtTime(0.6,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
    o.connect(g); g.connect(this.master); o.start(); o.stop(ctx.currentTime+0.8);
    this.burst(0.7,180,0.4,'lowpass');
  }
  jingle(){
    if(!this.ctx) return; const notes=[261.6,329.6,392.0];
    notes.forEach((f,i)=>this.tone(f,0.1,i*0.1,'sine',0.25));
  }
  cash(){ if(!this.ctx)return; [392,523,659,784].forEach((f,i)=>this.tone(f,0.12,i*0.09,'sine',0.25)); }
  tone(freq,dur,delay,type,gain){
    if(!this.ctx) return; const ctx=this.ctx, t=ctx.currentTime+(delay||0);
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||0.3,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  }
  startEngine(){
    if(!this.ctx||this.engineOsc) return;
    const ctx=this.ctx; this.engineOsc=ctx.createOscillator(); this.engineGain=ctx.createGain();
    this.engineOsc.type='sawtooth'; this.engineOsc.frequency.value=80;
    this.engineGain.gain.value=0.12;
    const lfo=ctx.createOscillator(), lfoG=ctx.createGain(); lfo.frequency.value=6; lfoG.gain.value=0.04;
    lfo.connect(lfoG); lfoG.connect(this.engineGain.gain); lfo.start();
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600;
    this.engineOsc.connect(f); f.connect(this.engineGain); this.engineGain.connect(this.master);
    this.engineOsc.start(); this._lfo=lfo;
  }
  setEngine(speed,maxSpeed){
    if(this.engineOsc) this.engineOsc.frequency.value=80+ (Math.abs(speed)/maxSpeed)*200;
  }
  stopEngine(){
    if(this.engineOsc){ try{this.engineOsc.stop();this._lfo.stop();}catch(e){} this.engineOsc=null; }
  }
  startSiren(){
    if(!this.ctx||this.sirenNodes) return; const ctx=this.ctx;
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=880; g.gain.value=0.08;
    o.connect(g); g.connect(this.master); o.start();
    this.sirenNodes={o,g,hi:true,t:0};
  }
  updateSiren(dt){
    if(!this.sirenNodes) return; this.sirenNodes.t+=dt;
    if(this.sirenNodes.t>0.4){ this.sirenNodes.t=0; this.sirenNodes.hi=!this.sirenNodes.hi;
      this.sirenNodes.o.frequency.value=this.sirenNodes.hi?880:660; }
  }
  stopSiren(){ if(this.sirenNodes){ try{this.sirenNodes.o.stop();}catch(e){} this.sirenNodes=null; } }
  startAmbient(){
    if(!this.ctx) return; const ctx=this.ctx; const src=ctx.createBufferSource();
    src.buffer=this.noiseBuf(2); src.loop=true;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
    const g=ctx.createGain(); g.gain.value=0.05;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(); this.ambientNode=src;
  }
}

// =================== PARTICLE SYSTEM ===================
function radialSprite(){
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const grd=g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(0.4,'rgba(255,255,255,0.6)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); return t;
}
class ParticleSystem{
  constructor(scene,max=400){
    this.max=max; this.tex=radialSprite();
    this.pos=new Float32Array(max*3); this.col=new Float32Array(max*3); this.siz=new Float32Array(max);
    this.parts=[];
    for(let i=0;i<max;i++) this.parts.push({active:false,vx:0,vy:0,vz:0,life:0,maxLife:1,grav:0,type:''});
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    geo.setAttribute('size',new THREE.BufferAttribute(this.siz,1));
    const mat=new THREE.PointsMaterial({size:1,map:this.tex,vertexColors:true,transparent:true,
      depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
    this.mat=mat; this.points=new THREE.Points(geo,mat); this.points.frustumCulled=false; scene.add(this.points);
    this.geo=geo;
  }
  spawn(x,y,z,type){
    for(let i=0;i<this.max;i++){ const p=this.parts[i]; if(p.active) continue;
      p.active=true; p.life=0;
      this.pos[i*3]=x; this.pos[i*3+1]=y; this.pos[i*3+2]=z;
      if(type==='smoke'){ p.vx=rand(-0.4,0.4); p.vy=rand(0.5,1.2); p.vz=rand(-0.4,0.4); p.maxLife=rand(2,3); p.grav=0;
        this.siz[i]=rand(0.5,1.5); this.setc(i,0.3,0.3,0.3); }
      else if(type==='fire'){ p.vx=rand(-0.5,0.5); p.vy=rand(1,2.5); p.vz=rand(-0.5,0.5); p.maxLife=rand(0.5,1); p.grav=0;
        this.siz[i]=rand(0.4,0.9); this.setc(i,1,rand(0.3,0.7),0.05); }
      else if(type==='spark'){ p.vx=rand(-3,3); p.vy=rand(1,5); p.vz=rand(-3,3); p.maxLife=rand(0.3,0.6); p.grav=-9;
        this.siz[i]=rand(0.1,0.25); this.setc(i,1,1,rand(0.5,0.9)); }
      else if(type==='muzzle'){ p.vx=rand(-2,2); p.vy=rand(-1,1); p.vz=rand(-2,2); p.maxLife=0.06; p.grav=0;
        this.siz[i]=rand(0.2,0.4); this.setc(i,1,1,0.7); }
      else if(type==='dust'){ p.vx=rand(-0.6,0.6); p.vy=rand(0.2,0.8); p.vz=rand(-0.6,0.6); p.maxLife=rand(0.6,1.2); p.grav=0.5;
        this.siz[i]=rand(0.3,0.6); this.setc(i,0.7,0.65,0.5); }
      else if(type==='water'){ p.vx=rand(-1,1); p.vy=rand(2,4); p.vz=rand(-1,1); p.maxLife=rand(0.8,1.4); p.grav=-9;
        this.siz[i]=rand(0.15,0.3); this.setc(i,0.6,0.8,1); }
      p.type=type; return;
    }
  }
  setc(i,r,g,b){ this.col[i*3]=r; this.col[i*3+1]=g; this.col[i*3+2]=b; }
  burst(x,y,z,type,n){ for(let k=0;k<n;k++) this.spawn(x,y,z,type); }
  explosion(x,y,z){
    this.burst(x,y,z,'fire',40); this.burst(x,y,z,'smoke',25); this.burst(x,y,z,'spark',40);
  }
  update(dt){
    for(let i=0;i<this.max;i++){ const p=this.parts[i]; if(!p.active) continue;
      p.life+=dt; if(p.life>=p.maxLife){ p.active=false; this.siz[i]=0; continue; }
      p.vy+=p.grav*dt;
      this.pos[i*3]+=p.vx*dt; this.pos[i*3+1]+=p.vy*dt; this.pos[i*3+2]+=p.vz*dt;
      if(p.type==='fire'){ p.vx+=rand(-1,1)*dt; p.vz+=rand(-1,1)*dt; }
    }
    this.geo.attributes.position.needsUpdate=true;
    this.geo.attributes.size.needsUpdate=true;
    this.geo.attributes.color.needsUpdate=true;
  }
}

function makeHumanoid(colors){
  const root=new THREE.Group();
  const skin=colors.skin, jacket=colors.jacket, pants=colors.pants;
  const matJ=new THREE.MeshStandardMaterial({color:jacket,roughness:0.8});
  const matS=new THREE.MeshStandardMaterial({color:skin,roughness:0.7});
  const matP=new THREE.MeshStandardMaterial({color:pants,roughness:0.8});
  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.6,1.0,0.3),matJ); torso.position.y=1.4; torso.castShadow=true; root.add(torso);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),matS); head.position.y=2.1; head.castShadow=true; root.add(head);
  // arms with shoulder pivots
  function arm(side){
    const pivot=new THREE.Group(); pivot.position.set(side*0.39,1.85,0);
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.7,0.18),matJ); m.position.y=-0.35; m.castShadow=true; pivot.add(m); root.add(pivot); return pivot;
  }
  function leg(side){
    const pivot=new THREE.Group(); pivot.position.set(side*0.16,0.9,0);
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.8,0.22),matP); m.position.y=-0.4; m.castShadow=true; pivot.add(m); root.add(pivot); return pivot;
  }
  root.userData.lArm=arm(-1); root.userData.rArm=arm(1);
  root.userData.lLeg=leg(-1); root.userData.rLeg=leg(1);
  root.userData.torso=torso; root.userData.head=head;
  return root;
}
function animateHumanoid(h,t,moving,running){
  const ud=h.userData; const sp=running?1.4:1; const amp=running?0.7:0.45;
  if(moving){ const s=Math.sin(t*8*sp);
    ud.lArm.rotation.x=s*amp; ud.rArm.rotation.x=-s*amp;
    ud.lLeg.rotation.x=-s*amp; ud.rLeg.rotation.x=s*amp;
    ud.head.position.y=2.1+(running?Math.abs(Math.sin(t*16))*0.05:0);
  } else {
    ud.lArm.rotation.x*=0.85; ud.rArm.rotation.x*=0.85; ud.lLeg.rotation.x*=0.85; ud.rLeg.rotation.x*=0.85;
    ud.torso.position.y=1.4+Math.sin(t*2)*0.02;
  }
}
function flailHumanoid(h,t){
  const ud=h.userData; const s=Math.sin(t*14);
  ud.lArm.rotation.x=s*1.2; ud.rArm.rotation.x=-s*1.2; ud.lArm.rotation.z=0.6; ud.rArm.rotation.z=-0.6;
  ud.lLeg.rotation.x=-Math.sin(t*12); ud.rLeg.rotation.x=Math.sin(t*12);
}

// =================== WORLD GENERATION ===================
const BLOCK=60, ROAD=20, GRID=12;
const CELL=BLOCK+ROAD; // 80

function* generateWorld(){
  G.CITY=GRID*CELL;
  const half=G.CITY/2;
  const offset=-half+CELL/2;
  yield 'Laying roads…';

  // Ground base
  const groundGeo=new THREE.PlaneGeometry(G.CITY+400,G.CITY+400);
  const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({color:0x101010,roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.05; ground.receiveShadow=true; G.scene.add(ground);

  // Roads: one big road plane network. We'll lay road strips along grid lines.
  const roadMat=new THREE.MeshStandardMaterial({color:PAL.road,roughness:0.95});
  const sideMat=new THREE.MeshStandardMaterial({color:PAL.sidewalk,roughness:1});
  const lineMat=new THREE.MeshStandardMaterial({color:0xddcc33,emissive:0x222200});
  const edgeMat=new THREE.MeshStandardMaterial({color:0xcccccc});

  for(let i=0;i<=GRID;i++){
    const x=offset-CELL/2 + i*CELL;
    // vertical road
    const r=new THREE.Mesh(new THREE.PlaneGeometry(ROAD,G.CITY+ROAD),roadMat);
    r.rotation.x=-Math.PI/2; r.position.set(x,0.01,0); r.receiveShadow=true; G.scene.add(r);
    // horizontal road
    const r2=new THREE.Mesh(new THREE.PlaneGeometry(G.CITY+ROAD,ROAD),roadMat);
    r2.rotation.x=-Math.PI/2; r2.position.set(0,0.011,x); r2.receiveShadow=true; G.scene.add(r2);
  }
  yield 'Painting lane markings…';
  // center dashed lines (vertical & horizontal)
  for(let i=0;i<=GRID;i++){
    const x=offset-CELL/2 + i*CELL;
    for(let z=-G.CITY/2;z<G.CITY/2;z+=8){
      const d=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.02,3),lineMat); d.position.set(x,0.03,z+offset%8); G.scene.add(d);
      const d2=new THREE.Mesh(new THREE.BoxGeometry(3,0.02,0.3),lineMat); d2.position.set(z+offset%8,0.03,x); G.scene.add(d2);
    }
  }

  yield 'Pouring sidewalks…';
  // Sidewalks around each block
  for(let bx=0;bx<GRID;bx++){
    for(let bz=0;bz<GRID;bz++){
      const cx=offset+bx*CELL, cz=offset+bz*CELL;
      const sw=BLOCK+6;
      const s=new THREE.Mesh(new THREE.BoxGeometry(sw,0.2,sw),sideMat);
      s.position.set(cx,0.1,cz); s.receiveShadow=true; G.scene.add(s);
    }
  }

  // Determine special blocks
  const parkBlocks=new Set();
  // central park 4x4 around center blocks 4..7
  for(let a=4;a<8;a++) for(let b=4;b<8;b++) parkBlocks.add(a+','+b);
  const heroes=[[2,2],[6,6],[10,10]];
  const heroSet=new Set(heroes.map(h=>h[0]+','+h[1]));
  // gang zones (3x3)
  G.gangZones=[
    {bx:1,bz:9,color:0xc0392b,name:'Reds'},
    {bx:9,bz:1,color:0x2980b9,name:'Blues'},
    {bx:1,bz:1,color:0x8e44ad,name:'Purples'},
  ];

  yield 'Raising buildings…';
  for(let bx=0;bx<GRID;bx++){
    for(let bz=0;bz<GRID;bz++){
      const key=bx+','+bz;
      const cx=offset+bx*CELL, cz=offset+bz*CELL;
      if(parkBlocks.has(key)) continue; // park handled later
      if(heroSet.has(key)){ makeHero(cx,cz); continue; }
      const count=randi(3,8);
      for(let k=0;k<count;k++){
        const fw=rand(10,40), fd=rand(10,40);
        const px=cx+rand(-BLOCK/2+fw/2, BLOCK/2-fw/2);
        const pz=cz+rand(-BLOCK/2+fd/2, BLOCK/2-fd/2);
        const h=rand(8,120);
        makeBuilding(px,pz,fw,fd,h);
      }
    }
    yield 'Raising buildings… '+Math.round(bx/GRID*100)+'%';
  }

  yield 'Planting the park…';
  makePark(offset+5.5*CELL - CELL/2 - CELL/2, offset+5.5*CELL - CELL/2 - CELL/2);
  // simpler: center park region center
  const pcx=offset+5.5*CELL-CELL, pcz=offset+5.5*CELL-CELL;

  yield 'Flooding the harbor…';
  makeHarbor(offset, -G.CITY/2-40);

  yield 'Building the overpass…';
  makeOverpass();

  yield 'Decorating alleys…';
  makeAlleyProps(offset);

  yield 'Wiring traffic lights…';
  makeTrafficLights(offset);

  yield 'Placing landmarks…';
  setupLocations(offset);

  yield 'Done';
}

function addAABB(mesh,w,h,d){
  const box={minX:mesh.position.x-w/2,maxX:mesh.position.x+w/2,minZ:mesh.position.z-d/2,maxZ:mesh.position.z+d/2,
    minY:mesh.position.y-h/2,maxY:mesh.position.y+h/2,mesh};
  G.buildingAABBs.push(box);
}

function makeBuilding(x,z,w,d,h){
  const col=choice(PAL.building);
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:0.85});
  const geo=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.Mesh(geo,mat); m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true;
  G.scene.add(m); G.buildings.push(m); addAABB(m,w,h,d);
  // window emissive grid via second material overlay - use emissive map effect: small boxes
  const winMat=new THREE.MeshStandardMaterial({color:0x222233,emissive:0xffdd88,emissiveIntensity:0});
  m.userData.winMat=winMat; m.userData.h=h;
  const rows=Math.floor(h/4), cols=Math.floor(w/4);
  const wgeo=new THREE.BoxGeometry(1.2,1.8,0.1);
  const inst=new THREE.InstancedMesh(wgeo,winMat,Math.max(1,rows*cols));
  let idx=0; const dummy=new THREE.Object3D();
  for(let r=1;r<rows;r++){ for(let c=0;c<cols;c++){
    if(Math.random()<0.3) continue;
    dummy.position.set(-w/2+2+c*4, r*4-h/2, d/2+0.05);
    dummy.rotation.set(0,0,0); dummy.updateMatrix(); inst.setMatrixAt(idx++,dummy.matrix);
  }}
  inst.count=idx; m.add(inst); m.userData.windows=inst;
  // rooftop details
  if(h>20 && Math.random()<0.6){
    const wt=new THREE.Group();
    const tank=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,3,8),new THREE.MeshStandardMaterial({color:0x554433}));
    tank.position.y=h/2+1.5; wt.add(tank);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(1.7,1.2,8),new THREE.MeshStandardMaterial({color:0x443322}));
    cone.position.y=h/2+3.5; wt.add(cone);
    wt.position.set(x,0,z); G.scene.add(wt);
  }
  if(Math.random()<0.5){
    const ac=new THREE.Mesh(new THREE.BoxGeometry(2,1,2),new THREE.MeshStandardMaterial({color:0x999999}));
    ac.position.set(x+rand(-w/3,w/3),h+0.5,z+rand(-d/3,d/3)); G.scene.add(ac);
  }
  if(h>40){
    const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,8,6),new THREE.MeshStandardMaterial({color:0x222222}));
    ant.position.set(x,h+4,z); G.scene.add(ant);
  }
  return m;
}

function makeHero(cx,cz){
  const h=rand(150,220); const w=34,d=34;
  const col=choice([0x394a5a,0x4A8FA8,0x2c3e50]);
  let y=0; let lvl=0;
  const group=new THREE.Group();

  for(let step=0;step<5;step++){
    const sw=w*(1-step*0.15), sd=d*(1-step*0.15), sh=h/5;
    const m=new THREE.Mesh(new THREE.BoxGeometry(sw,sh,sd),new THREE.MeshStandardMaterial({color:col,roughness:0.7}));
    m.position.y=y+sh/2; m.castShadow=true; group.add(m); y+=sh;
  }
  // spire
  const spire=new THREE.Mesh(new THREE.CylinderGeometry(0.3,2,16,8),new THREE.MeshStandardMaterial({color:0x888888}));
  spire.position.y=y+8; group.add(spire);

  const beacon=new THREE.Mesh(new THREE.SphereGeometry(1,8,8),new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:2}));
  beacon.position.y=y+17; group.add(beacon);

  const box={minX:cx-w/2,maxX:cx+w/2,minZ:cz-d/2,maxZ:cz+d/2,minY:0,maxY:h,mesh:group};
  G.buildingAABBs.push(box);
}

    const r=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.1),tl); r.position.set(p[0],t.H*0.4,-t.L/2); g.add(r);

  // police lightbar
  let lightbar=null;

    lb.position.x=-0.3; lightbar.add(lb);
    const lb2=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.15,0.3),new THREE.MeshStandardMaterial({color:0x0000ff,emissive:0x0000ff,emissiveIntensity:2}));
    lb2.position.x=0.3; lightbar.add(lb2);
    lightbar.position.set(0,t.H+0.1,0); g.add(lightbar);

  if(t.taxi){
    const sign=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,1),new THREE.MeshStandardMaterial({color:0x111111,emissive:0xffaa00,emissiveIntensity:0.3}));
    sign.position.set(0,t.H+0.2,0); g.add(sign);
  }
  if(opts.military){
    body.material=new THREE.MeshStandardMaterial({color:0x4b5320,roughness:0.7});
    const turret=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.5,0.6,8),new THREE.MeshStandardMaterial({color:0x3a4218}));
    turret.position.set(0,t.H+0.3,0); g.add(turret);
    const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,2,6),new THREE.MeshStandardMaterial({color:0x222222}));
    barrel.rotation.x=Math.PI/2; barrel.position.set(0,t.H+0.3,1); g.add(barrel);
  }

  g.position.set(x,wr,z);
  g.userData={
    type, vtype:t, name:opts.name||t.name, wheels, speed:0, steer:0, health:100,
    occupied:false, isPlayer:false, police:!!opts.police, military:!!opts.military,
    color, lightbar, vx:0, vz:0, drift:0, onFire:false, fireTimer:0, smoking:false,
    burned:false, exitTimer:0, stationary:opts.stationary, aiState:'idle',
    L:t.L,W:t.W,H:t.H, maxSpeed:t.maxSpeed, wr,
    targetWaypoint:null, despawnTimer:0,
  };
  G.scene.add(g);
  return g;
}

// =================== COLLISION ===================
function collideCircle(x,z,r){
  // returns adjusted position pushing out of building AABBs
  let nx=x,nz=z;
  for(const b of G.buildingAABBs){
    if(b.minY>2) continue; // only ground-level walls block; overpass deck high
    const cx=clamp(nx,b.minX,b.maxX), cz=clamp(nz,b.minZ,b.maxZ);
    const dx=nx-cx, dz=nz-cz; const d2=dx*dx+dz*dz;
    if(d2<r*r){
      const d=Math.sqrt(d2)||0.001;
      // push out
      if(d<0.0001){ nx=b.maxX+r; }
      else { nx=cx+dx/d*r; nz=cz+dz/d*r; }
    }
  }
  // world bounds
  const lim=G.CITY/2+30;
  nx=clamp(nx,-lim,lim); nz=clamp(nz,-lim,lim);
  return {x:nx,z:nz,hit:(nx!==x||nz!==z)};
}

function drawMinimap(){
  const ctx=UI.minimap; const W=160,H=160,R=80;
  ctx.save(); ctx.clearRect(0,0,W,H);
  ctx.beginPath(); ctx.arc(R,R,R,0,TAU); ctx.clip();
  ctx.fillStyle='#243024'; ctx.fillRect(0,0,W,H);
  const px=G.player.mesh.position.x, pz=G.player.mesh.position.z;
  const scale=R/100; // 200u area
  const ry= G.player.inVehicle ? G.player.inVehicle.rotation.y : G.player.rotY;
  function tx(x,z){
    let dx=x-px, dz=z-pz;
    // rotate by -ry so player faces up
    const c=Math.cos(ry), s=Math.sin(ry);
    const rx=dx*c - dz*s, rz=dx*s + dz*c;
    return [R+rx*scale, R+rz*scale];
  }
  // roads grid
  const half=G.CITY/2, offset=-half+CELL/2;
  ctx.strokeStyle='#555'; ctx.lineWidth=3;
  for(let i=0;i<=GRID;i++){
    const gx=offset-CELL/2+i*CELL;
    let a=tx(gx,-half),b=tx(gx,half); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    let c2=tx(-half,gx),d=tx(half,gx); ctx.beginPath(); ctx.moveTo(c2[0],c2[1]); ctx.lineTo(d[0],d[1]); ctx.stroke();
  }
  // buildings near
  ctx.fillStyle='#1a1a22';
  for(const b of G.buildingAABBs){
    const bx=(b.minX+b.maxX)/2, bz=(b.minZ+b.maxZ)/2;
    if(Math.abs(bx-px)>110||Math.abs(bz-pz)>110) continue;
    const p=tx(bx,bz); ctx.fillRect(p[0]-2,p[1]-2,4,4);
  }
  // markers
  ctx.fillStyle='#ff44cc';
  G.markers.forEach(mk=>{ if(Math.abs(mk.x-px)<110&&Math.abs(mk.z-pz)<110){ const p=tx(mk.x,mk.z); ctx.beginPath(); ctx.arc(p[0],p[1],3,0,TAU); ctx.fill(); }});
  // paySpray on map
  ctx.fillStyle='#44ff88';
  G.paySpray.forEach(s=>{ const p=tx(s.x,s.z); if(p[0]>-10&&p[0]<W+10){ctx.fillRect(p[0]-2,p[1]-2,4,4);} });
  // police dots
  ctx.fillStyle='#ff2222';
  G.police.forEach(p=>{ if(Math.abs(p.position.x-px)<110&&Math.abs(p.position.z-pz)<110){ const q=tx(p.position.x,p.position.z); ctx.beginPath(); ctx.arc(q[0],q[1],3,0,TAU); ctx.fill(); }});
  // waypoint
  if(G.mission&&G.mission.waypoint){ const w=G.mission.waypoint; const p=tx(w.x,w.z);
    ctx.fillStyle=(Math.floor(performance.now()/300)%2)?'#ffff00':'#aa8800'; ctx.beginPath(); ctx.arc(clamp(p[0],4,W-4),clamp(p[1],4,H-4),4,0,TAU); ctx.fill(); }
  // player arrow
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.beginPath();
  ctx.moveTo(R,R-7); ctx.lineTo(R-5,R+6); ctx.lineTo(R+5,R+6); ctx.closePath(); ctx.fill();
}

// =================== WANTED SYSTEM ===================
function addWanted(amount){
  if(G.wanted>=5) return;
  G.wanted=clamp(G.wanted+amount,0,5); G.wantedGainFlash=1; G.lastSeenTimer=0;
  ensurePolice();
}
function clearWanted(){ G.wanted=0; G.police.forEach(p=>{G.scene.remove(p);}); G.police.length=0; G.audio.stopSiren(); }

function ensurePolice(){
  const want=Math.ceil(G.wanted);
  let desired=0;
  if(want>=1) desired=2; if(want>=2) desired=4; if(want>=3) desired=6; if(want>=4) desired=7; if(want>=5) desired=8;
  while(G.police.length<desired){ spawnPoliceCar(); }
  if(G.wanted>0) G.audio.startSiren();
}
function spawnPoliceCar(){
  const px=G.player.mesh.position.x, pz=G.player.mesh.position.z;
  const a=rand(0,TAU), r=120;
  const x=px+Math.cos(a)*r, z=pz+Math.sin(a)*r;

  const want=Math.ceil(G.wanted);

  else if(want>=3 && Math.random()<0.4){ opts={police:true,color:0x222222,name:'SWAT'}; type='suv'; }

}

// =================== EXPLOSIONS ===================
function createExplosion(x,y,z,radius,dmg){
  G.particles.explosion(x,y,z);
  G.audio.explosion();
  const light=new THREE.PointLight(0xff8822,8,radius*3); light.position.set(x,y+2,z); G.scene.add(light);
  G.explosions.push({light,t:0});
  // damage entities
  const p=G.player.mesh.position; const pd=Math.hypot(p.x-x,p.z-z);
  if(pd<radius){ damagePlayer(dmg*(1-pd/radius)); }
  G.peds.forEach(pe=>{ if(!pe.dead){ const d=Math.hypot(pe.mesh.position.x-x,pe.mesh.position.z-z); if(d<radius){ pe.hp-=dmg; pe.state='panic'; pe.pauseT=0.5; if(pe.hp<=0) killPed(pe); }}});
  G.vehicles.concat(G.police).forEach(v=>{ const d=Math.hypot(v.position.x-x,v.position.z-z); if(d<radius&&!v.userData.burned){ damageVehicle(v,dmg); }});
}

// =================== DAMAGE ===================
function damagePlayer(dmg){
  if(G.player.invuln>0||G.dead) return;
  if(G.player.armor>0){
    const absorb=Math.min(G.player.armor,dmg*0.5);
    G.player.armor-=absorb; dmg-=absorb;
  }
  G.player.hp-=dmg; damageFlash();
  if(G.player.hp<=0){ G.player.hp=0; playerDeath(); }
}
function killPed(pe){
  pe.dead=true; G.scene.remove(pe.mesh);
  G.money+=25;
  // ragdoll skip; spawn money pickup feeling
}
function damageVehicle(v,dmg){
  if(v.userData.burned) return;
  v.userData.health-=dmg;
  if(v.userData.health<=30 && !v.userData.smoking){ v.userData.smoking=true; }
  if(v.userData.health<=0 && !v.userData.onFire){ v.userData.onFire=true; v.userData.fireTimer=0; }
}

function playerDeath(){
  if(G.dead) return; G.dead=true;
  if(G.player.inVehicle) exitVehicle(true);
  document.getElementById('deathOverlay').style.opacity=0.85;
  setTimeout(()=>{ respawnPlayer(); },3000);
}
function respawnPlayer(){
  G.dead=false; document.getElementById('deathOverlay').style.opacity=0;
  // nearest hospital
  let best=G.hospitals[0],bd=1e9;
  G.hospitals.forEach(h=>{ const d=Math.hypot(h.x-G.player.mesh.position.x,h.z-G.player.mesh.position.z); if(d<bd){bd=d;best=h;} });
  G.player.mesh.position.set(best.x,0,best.z);
  G.player.hp=100; G.player.armor=0; G.player.vx=G.player.vz=G.player.vy=0;
  clearWanted();
  // clear weapons except fists
  G.player.weapons={fists:{ammo:Infinity,reserve:0}}; G.player.weapon='fists';
  G.money=Math.max(0,G.money-500);
  G.player.invuln=2;
  if(G.mission&&G.mission.active) failMission('You were wasted');
}

// =================== VEHICLE ENTER/EXIT ===================
function nearestVehicle(maxd){
  let best=null,bd=maxd;
  const p=G.player.mesh.position;
  G.vehicles.concat(G.police).forEach(v=>{ if(v.userData.burned) return; const d=Math.hypot(v.position.x-p.x,v.position.z-p.z); if(d<bd){bd=d;best=v;} });
  return best;
}
function enterVehicle(v){
  G.player.inVehicle=v; v.userData.occupied=true; v.userData.isPlayer=true;
  G.player.mesh.visible=false;
  G.audio.startEngine();
  showVehName(v.userData.name);
  // wanted: stealing
  if(!v.userData.police){ // stealing a civilian car
    if(anyNpcSees()){ addWanted(1); }
  }
  v.userData.stationary=false; v.userData.aiState='player';
}
function exitVehicle(force){
  const v=G.player.inVehicle; if(!v) return;
  v.userData.occupied=false; v.userData.isPlayer=false; v.userData.aiState='idle';
  v.userData.speed*=0.3;
  const ox=v.position.x+Math.cos(v.rotation.y)*0 - Math.sin(v.rotation.y)*(v.userData.W+0.6);
  const oz=v.position.z+Math.sin(v.rotation.y)*0 + Math.cos(v.rotation.y)*(v.userData.W+0.6);
  G.player.mesh.position.set(ox,0,oz);
  G.player.rotY=v.rotation.y;
  G.player.mesh.visible=true; G.player.inVehicle=null;
  G.audio.stopEngine();
  v.userData.despawnTimer=30; // despawn stolen civilian later
}
function anyNpcSees(){
  const p=G.player.mesh.position;
  for(const pe of G.peds){ if(pe.dead) continue; if(Math.hypot(pe.mesh.position.x-p.x,pe.mesh.position.z-p.z)<25) return true; }
  return false;
}

// =================== WEAPONS FIRING ===================
function firePrimary(){
  const w=WEAPONS[G.player.weapon]; const wd=G.player.weapons[G.player.weapon];
  if(G.player.fireCD>0) return;
  if(w.melee){ meleePunch(); G.player.fireCD=w.cd; return; }
  if(w.throw){ throwProjectile(G.player.weapon); G.player.fireCD=0.8; return; }
  if(wd.ammo<=0){ return; } // need reload
  G.player.fireCD=w.cd;
  if(!w.stream) wd.ammo--;
  addWanted(0); // firing in public handled below once
  if(!G.firedInPublic){ addWanted(1); G.firedInPublic=true; setTimeout(()=>G.firedInPublic=false,3000); }
  fleeNearbyPeds();

  const origin=getMuzzlePos();
  const dir=getAimDir();
  G.audio.gunshot(w.sound);
  G.particles.burst(origin.x,origin.y,origin.z,'muzzle',4);

  if(w.projectile){ spawnRocket(origin,dir); return; }
  if(w.stream){ flamethrow(origin,dir); return; }

  const pellets=w.pellets||1;
  for(let i=0;i<pellets;i++){
    const spread=(w.spread||0)*Math.PI/180;
    const d=dir.clone();
    d.x+=rand(-spread,spread); d.y+=rand(-spread,spread); d.z+=rand(-spread,spread); d.normalize();
    hitscan(origin,d,w.range,w.dmg);
  }
  // tracer/casing
  G.particles.spawn(origin.x+0.3,origin.y,origin.z,'spark');
}
function getMuzzlePos(){
  const p= G.player.inVehicle ? G.player.inVehicle.position : G.player.mesh.position;
  const ry= G.player.inVehicle ? G.player.inVehicle.rotation.y : G.player.rotY;
  return new THREE.Vector3(p.x - Math.sin(ry)*0.6, 1.5, p.z - Math.cos(ry)*0.6);
}
function getAimDir(){
  if(G.lockTarget && !G.lockTarget.dead){
    const t=G.lockTarget.mesh.position; const o=getMuzzlePos();
    return new THREE.Vector3(t.x-o.x,1.4-o.y,t.z-o.z).normalize();
  }
  const ry= G.player.inVehicle ? G.player.inVehicle.rotation.y : G.player.rotY;
  return new THREE.Vector3(-Math.sin(ry),0,-Math.cos(ry)).normalize();
}
function hitscan(origin,dir,range,dmg){
  // check peds & police & vehicles, nearest along ray
  let bestT=range, hitPed=null, hitVeh=null;
  const ro=origin, rd=dir;
  G.peds.forEach(pe=>{ if(pe.dead) return; const t=raySphere(ro,rd,pe.mesh.position,1.2); if(t>0&&t<bestT){bestT=t;hitPed=pe;hitVeh=null;} });
  G.police.concat(G.vehicles).forEach(v=>{ if(v.userData.burned)return; const t=raySphere(ro,rd,v.position,2); if(t>0&&t<bestT){bestT=t;hitVeh=v;hitPed=null;} });
  const hp=new THREE.Vector3(ro.x+rd.x*bestT,ro.y+rd.y*bestT,ro.z+rd.z*bestT);
  G.particles.spawn(hp.x,hp.y,hp.z,'spark');
  if(hitPed){ hitPed.hp-=dmg; hitPed.state='flee'; if(hitPed.hp<=0){ killPed(hitPed); addWanted(1); checkMissionKill(hitPed); }
    if(hitPed.gang){ enrageGang(hitPed); } }
  else if(hitVeh){ damageVehicle(hitVeh,dmg);
    if(hitVeh.userData.police){ /* shooting police */ }
  }
}
function raySphere(o,d,c,r){
  const ox=o.x-c.x, oy=o.y-(c.y+1.2), oz=o.z-c.z;
  const b=ox*d.x+oy*d.y+oz*d.z; const cc=ox*ox+oy*oy+oz*oz-r*r;
  const disc=b*b-cc; if(disc<0) return -1; const t=-b-Math.sqrt(disc); return t;
}
function meleePunch(){
  G.audio.punch();
  const o=G.player.mesh.position; const ry=G.player.rotY;
  const fx=o.x-Math.sin(ry)*1.2, fz=o.z-Math.cos(ry)*1.2;
  G.peds.forEach(pe=>{ if(pe.dead)return; if(Math.hypot(pe.mesh.position.x-fx,pe.mesh.position.z-fz)<1.2){ pe.hp-=8; pe.state='flee'; addWanted(0.5); if(pe.hp<=0){killPed(pe);addWanted(0.5);} if(pe.gang) enrageGang(pe); }});
}
function flamethrow(origin,dir){
  for(let i=0;i<3;i++){ const d=i*4; G.particles.burst(origin.x+dir.x*d,origin.y+dir.y*d,origin.z+dir.z*d,'fire',2); }
  G.peds.forEach(pe=>{ if(pe.dead)return; const dx=pe.mesh.position.x-origin.x, dz=pe.mesh.position.z-origin.z; const dist=Math.hypot(dx,dz);
    if(dist<12){ const dot=(dx*dir.x+dz*dir.z)/dist; if(dot>0.6){ pe.hp-=4; pe.state='flee'; if(pe.hp<=0)killPed(pe);} }});
  G.vehicles.concat(G.police).forEach(v=>{ const dx=v.position.x-origin.x, dz=v.position.z-origin.z; const dist=Math.hypot(dx,dz);
    if(dist<12){ const dot=(dx*dir.x+dz*dir.z)/dist; if(dot>0.6){ v.userData.onFire=true; }}});
}
function spawnRocket(origin,dir){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,1,8),new THREE.MeshStandardMaterial({color:0x333333,emissive:0x441100}));
  m.position.copy(origin); G.scene.add(m);
  G.bullets.push({mesh:m,vx:dir.x*40,vy:dir.y*40,vz:dir.z*40,life:4,type:'rocket'});
}
function throwProjectile(kind){
  const w=WEAPONS[kind]; const wd=G.player.weapons[kind]; if(wd.ammo<=0) return; wd.ammo--;
  const o=getMuzzlePos(); const dir=getAimDir();
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),new THREE.MeshStandardMaterial({color:kind==='molotov'?0xcc6600:0x222222}));
  m.position.copy(o); m.position.y=1.6; G.scene.add(m);
  G.bullets.push({mesh:m,vx:dir.x*15,vy:6,vz:dir.z*15,life:kind==='grenade'?3:5,type:kind,bounce:kind==='grenade'});
}

function fleeNearbyPeds(){
  const p=G.player.mesh.position;
  G.peds.forEach(pe=>{ if(pe.dead)return; if(Math.hypot(pe.mesh.position.x-p.x,pe.mesh.position.z-p.z)<30){ pe.state='flee'; }});
}
function enrageGang(pe){
  if(!pe.gang)return;
  G.peds.forEach(o=>{ if(o.gang===pe.gang && Math.hypot(o.mesh.position.x-pe.mesh.position.x,o.mesh.position.z-pe.mesh.position.z)<40){ o.hostile=true; o.state='combat'; }});
}

// =================== RELOAD / WEAPON SELECT ===================
function reload(){
  const w=WEAPONS[G.player.weapon]; const wd=G.player.weapons[G.player.weapon];
  if(w.melee||w.throw) return;
  if(wd.ammo>=w.clip||wd.reserve<=0) return;
  const need=w.clip-wd.ammo; const take=Math.min(need,wd.reserve);
  wd.ammo+=take; wd.reserve-=take;
}
function giveWeapon(name){
  const w=WEAPONS[name];
  if(!G.player.weapons[name]) G.player.weapons[name]={ammo:w.clip===Infinity?Infinity:w.clip,reserve:w.max};
  else G.player.weapons[name].reserve=Math.min(w.max,G.player.weapons[name].reserve+w.clip);
  G.player.weapon=name;
}

// =================== MISSIONS ===================
function makeMarker(x,z,color){
  const g=new THREE.Group();
  const torus=new THREE.Mesh(new THREE.TorusGeometry(2,0.3,8,20),new THREE.MeshStandardMaterial({color:color||0xffff00,emissive:color||0xffff00,emissiveIntensity:0.8}));
  torus.rotation.x=Math.PI/2; torus.position.y=0.5; g.add(torus);
  const light=new THREE.SpotLight(color||0xffff00,2,20,0.5); light.position.set(x,15,z); light.target.position.set(x,0,z);
  g.add(light); g.add(light.target);
  g.position.set(x,0,z); G.scene.add(g);
  return g;
}

const MISSIONS=[
  {id:1,name:'First Ride',brief:'Get in the marked car and drive to the dropoff in 60s.',reward:500,timeLimit:60},
  {id:2,name:'Clean Up',brief:'Eliminate 3 gang members. 90s.',reward:1500,rewardWeapon:'pistol',timeLimit:90},
  {id:3,name:'Hot Wheels',brief:'Steal a police car, hit a Pay-n-Spray, deliver to warehouse.',reward:2500,timeLimit:120},
  {id:4,name:'Blow Out',brief:'Destroy 5 marked vehicles before reaching 4 stars.',reward:4000,rewardWeapon:'rpg',timeLimit:120},
  {id:5,name:'The Big Score',brief:'Rob the bank, then escape to the safehouse with 5 stars.',reward:20000,timeLimit:180},
];
let missionMarkers=[];
function placeMissionMarkers(){
  const half=G.CITY/2, offset=-half+CELL/2;
  // place 5 yellow start markers near player start
  const spots=[[5,3],[6,4],[4,5],[7,3],[5,6]];
  MISSIONS.forEach((m,i)=>{
    const x=offset+spots[i][0]*CELL, z=offset+spots[i][1]*CELL;
    const mk=makeMarker(x,z,0xffff00);
    missionMarkers.push({mk,mission:m,x,z,done:false});
    G.markers.push({x,z,type:'mission'});
  });
}
function startMission(m){
  G.mission={def:m,state:'active',active:true,timer:m.timeLimit,objIndex:0,data:{},waypoint:null,targets:[]};
  bigMsg('MISSION: '+m.name,'#ffd000');
  setupMissionObjective(m);
}
function setupMissionObjective(m){
  const half=G.CITY/2, offset=-half+CELL/2;
  if(m.id===1){
    // spawn a marked car near player
    const v=makeVehicle('sedan',G.player.mesh.position.x+6,G.player.mesh.position.z, {color:0xffdd00,name:'Mission Car'});
    G.vehicles.push(v); G.mission.data.car=v; v.userData.missionBlink=true;
    G.mission.waypoint={x:offset+9*CELL,z:offset+7*CELL};
    showObjective('Get in the yellow car');
  } else if(m.id===2){
    for(let i=0;i<3;i++){
      const pe=createPed(G.player.mesh.position.x+rand(-20,20),G.player.mesh.position.z+rand(-20,20),{color:0xcc0000});
      pe.hp=40; pe.hostile=true; pe.state='combat'; pe.missionTarget=true; G.peds.push(pe);
      G.mission.targets.push(pe);
      // red marker above
      const mk=new THREE.Mesh(new THREE.ConeGeometry(0.4,0.8,6),new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000}));
      mk.position.y=3; mk.rotation.x=Math.PI; pe.mesh.add(mk);
    }
    G.mission.data.left=3; showObjective('Eliminate the gang members (3)');
  } else if(m.id===3){
    addWanted(1.1); // spawn police to steal
    showObjective('Steal a police car');
  } else if(m.id===4){
    G.mission.targets=[];
    for(let i=0;i<5;i++){
      const v=makeVehicle('sedan',G.player.mesh.position.x+rand(-40,40),G.player.mesh.position.z+rand(-40,40),{stationary:true,color:0x888888});
      G.vehicles.push(v); G.mission.targets.push(v);
      const mk=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.1),new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000}));
      mk.position.y=3; v.add(mk);
    }
    G.mission.data.left=5; showObjective('Destroy the 5 marked vehicles (5)');
  } else if(m.id===5){
    G.mission.waypoint={x:offset+6*CELL,z:offset+6*CELL};
    showObjective('Drive to the bank');
    G.mission.data.stage='gotobank';
  }
}
function checkMissionKill(pe){
  if(G.mission&&G.mission.active&&G.mission.def.id===2&&pe.missionTarget){
    G.mission.data.left--;
    if(G.mission.data.left<=0) completeMission();
    else showObjective('Eliminate the gang members ('+G.mission.data.left+')');
  }
}
function completeMission(){
  const m=G.mission.def;
  G.money+=m.reward; G.audio.cash();
  if(m.rewardWeapon) giveWeapon(m.rewardWeapon);
  if(m.id===5){ Object.keys(G.player.weapons).forEach(w=>{ if(WEAPONS[w].max) G.player.weapons[w].reserve=WEAPONS[w].max; }); }
  bigMsg('MISSION COMPLETE +$'+m.reward,'#33ff33');
  showObjective(''); G.mission.active=false; G.mission=null;
  missionMarkers.forEach(mm=>{ if(mm.mission.id===m.id) mm.done=true; });
}
function failMission(reason){
  bigMsg('MISSION FAILED','#ff3333'); toast(reason||'');
  showObjective(''); if(G.mission){ G.mission.active=false; G.mission=null; }
}
function updateMission(dt){
  if(!G.mission||!G.mission.active) return;
  const m=G.mission.def, M=G.mission;
  M.timer-=dt;
  UI.mtimer.style.opacity=1; UI.mtimer.textContent=Math.max(0,Math.ceil(M.timer))+'s';
  if(M.timer<=0){ failMission('Out of time'); UI.mtimer.style.opacity=0; return; }
  const p=G.player.mesh.position;
  if(m.id===1){
    if(M.data.car&&G.player.inVehicle===M.data.car){ showObjective('Drive to the dropoff'); }
    if(M.waypoint){ const d=Math.hypot(p.x-M.waypoint.x,p.z-M.waypoint.z); if(d<5&&G.player.inVehicle){ completeMission(); } }
  } else if(m.id===3){
    if(G.player.inVehicle&&G.player.inVehicle.userData.police){ M.data.gotcar=true; showObjective('Lose the cops at a Pay-n-Spray'); }
    if(M.data.gotcar&&G.wanted===0){ M.data.clean=true; showObjective('Deliver car to warehouse');
      if(!M.waypoint){ const half=G.CITY/2,offset=-half+CELL/2; M.waypoint={x:offset+11*CELL,z:offset+11*CELL}; } }
    if(M.data.clean&&M.waypoint){ const d=Math.hypot(p.x-M.waypoint.x,p.z-M.waypoint.z); if(d<6) completeMission(); }
  } else if(m.id===4){
    let left=0; M.targets.forEach(v=>{ if(!v.userData.burned) left++; });
    if(left!==M.data.left){ M.data.left=left; showObjective('Destroy the 5 marked vehicles ('+left+')'); }
    if(left<=0) completeMission();
    if(G.wanted>=4) failMission('Too much heat');
  } else if(m.id===5){
    if(M.data.stage==='gotobank'){
      const d=Math.hypot(p.x-M.waypoint.x,p.z-M.waypoint.z);
      if(d<8){ M.data.stage='heist'; M.data.heistT=10; showObjective('ROBBING BANK...'); bigMsg('ROBBING BANK...','#ffd000'); }
    } else if(M.data.stage==='heist'){
      M.data.heistT-=dt;
      if(M.data.heistT<=0){ G.wanted=5; ensurePolice(); M.data.stage='escape';
        const half=G.CITY/2,offset=-half+CELL/2; M.waypoint=choice(G.safehouses); showObjective('Escape to the safehouse!'); }
    } else if(M.data.stage==='escape'){
      const d=Math.hypot(p.x-M.waypoint.x,p.z-M.waypoint.z);
      if(d<8) completeMission();
    }
  }
}

let shopOpen=false;
function openShop(shop){
  shopOpen=true; G.paused=true;
  const panel=document.getElementById('shopPanel');
  document.getElementById('shopTitle').textContent=shop.name;
  const items=document.getElementById('shopItems'); items.innerHTML='';
  let list=[];
  if(shop.type==='ammu'){
    list=[['Pistol Ammo (+50)',100,()=>giveWeapon('pistol')],
      ['Shotgun (+8)',500,()=>giveWeapon('shotgun')],
      ['Uzi (+120)',800,()=>giveWeapon('smg')],
      ['AK-47 (+120)',1500,()=>giveWeapon('rifle')],
      ['Sniper (+25)',2000,()=>giveWeapon('sniper')],
      ['Body Armor',200,()=>{G.player.armor=100;}]];
  } else if(shop.type==='hospital'){
    list=[['Full Heal',0,()=>{G.player.hp=100;}],['Body Armor',200,()=>{G.player.armor=100;}]];
  } else if(shop.type==='food'){
    list=[['Burger (+20 HP)',30,()=>{G.player.hp=Math.min(100,G.player.hp+20);}]];
  }
  list.forEach(it=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<span>${it[0]}</span><span>$${it[1]}</span>`;
    d.onclick=()=>{ if(G.money>=it[1]){ G.money-=it[1]; it[2](); G.audio.jingle(); toast('Purchased'); } else toast('Not enough cash'); };
    items.appendChild(d);
  });
  panel.style.display='flex';
}
function closeShop(){ shopOpen=false; G.paused=false; document.getElementById('shopPanel').style.display='none'; }

function saveGame(){
  const s={pos:[G.player.mesh.position.x,G.player.mesh.position.z],money:G.money,hp:G.player.hp,armor:G.player.armor,
    weapons:Object.keys(G.player.weapons),time:G.time};
  localStorage.setItem('gta_save',JSON.stringify(s)); toast('GAME SAVED');
}
function loadGame(){
  try{ const s=JSON.parse(localStorage.getItem('gta_save')); if(!s) return;
    G.player.mesh.position.set(s.pos[0],0,s.pos[1]); G.money=s.money; G.player.hp=s.hp; G.player.armor=s.armor||0;
    s.weapons.forEach(w=>{ if(w!=='fists') giveWeapon(w); }); G.player.weapon='fists'; G.time=s.time||G.time;
    toast('GAME LOADED');
  }catch(e){}
}

const keys=G.keys;
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k==='tab'){ e.preventDefault(); togglePause(); }
  if(k==='escape'){ if(shopOpen) closeShop(); else if(G.paused) togglePause(); }
  if(k==='f') tryEnterExit();
  if(k==='v') cycleCamera();
  if(k==='r') reload();
  if(k==='e') tryInteract();
  if(k==='g'){ throwProjectile(WEAPONS[G.player.weapon].throw?G.player.weapon:'grenade'); }
  if(k==='l') toggleLock();
  if(k==='q' && !G.wheelOpen) openWheel();
  if(k==='enter' && G.mission&&G.mission.state==='briefing') startMission(G.mission.def);
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase(); keys[k]=false;
  if(k==='q' && G.wheelOpen) closeWheel();
});
const gameDiv=document.getElementById('game');
window.addEventListener('mousedown',e=>{
  if(!G.started) return;
  if(e.button===0){ G.mouse.down=true; firePrimary(); }
  if(e.button===2){ G.mouse.right=true; G.aiming=!G.player.inVehicle; }
});
window.addEventListener('mouseup',e=>{
  if(e.button===0) G.mouse.down=false;
  if(e.button===2){ G.mouse.right=false; G.aiming=false; }
});
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===gameDiv){
    G.camOrbit.theta-=e.movementX*0.003;
    G.camOrbit.phi=clamp(G.camOrbit.phi-e.movementY*0.003,0.1,1.4);
    if(!G.player.inVehicle && (G.aiming|| true)){ /* aim handled by orbit theta */ }
  }
});
window.addEventListener('wheel',e=>{ G.camOrbit.dist=clamp(G.camOrbit.dist+e.deltaY*0.01,3,12); });
gameDiv.addEventListener('click',()=>{ if(G.started && !G.paused) gameDiv.requestPointerLock(); });

function tryEnterExit(){
  if(!G.started) return;
  if(G.player.inVehicle){ exitVehicle(); }
  else { const v=nearestVehicle(3); if(v) enterVehicle(v); }
}
function tryInteract(){
  // mission briefing
  if(G.mission&&G.mission.state==='briefing'){ startMission(G.mission.def); return; }
  // shop
  const p=G.player.mesh.position;
  for(const s of G.shops){ if(Math.hypot(s.x-p.x,s.z-p.z)<4){ openShop(s); return; } }
  // safehouse save
  for(const s of G.safehouses){ if(Math.hypot(s.x-p.x,s.z-p.z)<5){ saveGame(); return; } }
}
function toggleLock(){
  if(G.lockTarget){ G.lockTarget=null; return; }
  // find nearest enemy in arc
  let best=null,bd=30; const p=G.player.mesh.position; const ry=G.player.rotY;
  const fwd={x:-Math.sin(ry),z:-Math.cos(ry)};
  G.peds.forEach(pe=>{ if(pe.dead)return; const dx=pe.mesh.position.x-p.x,dz=pe.mesh.position.z-p.z; const d=Math.hypot(dx,dz);
    if(d<bd){ const dot=(dx*fwd.x+dz*fwd.z)/d; if(dot>0.5){ bd=d; best=pe; } }});
  G.lockTarget=best;
}
function cycleCamera(){ G.cameraMode=(G.cameraMode+1)%4; }
function togglePause(){
  if(shopOpen) return;
  G.paused=!G.paused;
  document.getElementById('pausePanel').style.display=G.paused?'flex':'none';
  if(G.paused) drawBigMap();
}
