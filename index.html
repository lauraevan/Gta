const wheelCanvas=document.getElementById('wheelCanvas');
function openWheel(){ G.wheelOpen=true; G.timeScale=0.2; document.getElementById('weaponWheel').style.display='flex'; drawWheel(); }
function closeWheel(){
  G.wheelOpen=false; G.timeScale=1; document.getElementById('weaponWheel').style.display='none';
  // pick by mouse angle
  const idx=wheelSelection(); if(idx>=0){ const name=WEAPON_ORDER[idx]; if(G.player.weapons[name]) G.player.weapon=name; }
}
function wheelSelection(){
  const a=Math.atan2(G.mouse.y-200,G.mouse.x-200);
  let idx=Math.round((a+Math.PI/2)/(TAU/8)); idx=((idx%8)+8)%8; return idx;
}
function drawWheel(){
  const c=wheelCanvas.getContext('2d'); c.clearRect(0,0,400,400);
  for(let i=0;i<8;i++){
    const a=i*(TAU/8)-Math.PI/2; const x=200+Math.cos(a)*130, y=200+Math.sin(a)*130;
    const name=WEAPON_ORDER[i]; const owned=!!G.player.weapons[name];
    c.fillStyle=owned?'#ff8c1a':'#444'; c.beginPath(); c.arc(x,y,34,0,TAU); c.fill();
    c.fillStyle='#fff'; c.font='20px Arial'; c.textAlign='center'; c.fillText(WEAPONS[name].icon,x,y+4);
    c.font='10px Arial'; c.fillText(WEAPONS[name].name,x,y+24);
  }
}
window.addEventListener('mousemove',e=>{ if(G.wheelOpen){ G.mouse.x=e.clientX-(window.innerWidth/2-200); G.mouse.y=e.clientY-(window.innerHeight/2-200); }});

// =================== TOUCH ===================
const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const touch={move:{x:0,y:0,active:false},cam:{x:0,y:0}};
if(isMobile){
  document.getElementById('touch').style.display='block';
  setupJoystick('joyMove','joyMoveK',(x,y)=>{touch.move.x=x;touch.move.y=y;touch.move.active=(x||y)!==0;});
  setupJoystick('joyCam','joyCamK',(x,y)=>{G.camOrbit.theta-=x*0.05;G.camOrbit.phi=clamp(G.camOrbit.phi-y*0.03,0.1,1.4);});
  document.getElementById('btnFire').addEventListener('touchstart',e=>{e.preventDefault();G.mouse.down=true;firePrimary();});
  document.getElementById('btnFire').addEventListener('touchend',e=>{e.preventDefault();G.mouse.down=false;});
  document.getElementById('btnJump').addEventListener('touchstart',e=>{e.preventDefault();keys[' ']=true;setTimeout(()=>keys[' ']=false,100);});
  document.getElementById('btnEnter').addEventListener('touchstart',e=>{e.preventDefault();tryEnterExit();});
}
function setupJoystick(id,knobId,cb){
  const el=document.getElementById(id),knob=document.getElementById(knobId);
  let active=false,cx=0,cy=0;
  el.addEventListener('touchstart',e=>{e.preventDefault();active=true;const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;});
  el.addEventListener('touchmove',e=>{e.preventDefault();if(!active)return;const t=e.touches[0];let dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.hypot(dx,dy),max=40;if(d>max){dx*=max/d;dy*=max/d;}knob.style.transform=`translate(${dx}px,${dy}px)`;cb(dx/max,dy/max);});
  el.addEventListener('touchend',e=>{e.preventDefault();active=false;knob.style.transform='';cb(0,0);});
}

// =================== CAMERA UPDATE ===================
function updateCamera(dt){
  const cam=G.camera;
  if(G.player.inVehicle){
    const v=G.player.inVehicle; const ry=v.rotation.y;
    if(G.cameraMode===1){ // bumper
      cam.position.set(v.position.x-Math.sin(ry)*-(v.userData.L/2),1,v.position.z-Math.cos(ry)*-(v.userData.L/2));
      cam.lookAt(v.position.x-Math.sin(ry)*5,1,v.position.z-Math.cos(ry)*5);
    } else if(G.cameraMode===2){ // topdown
      cam.position.set(v.position.x,30,v.position.z); cam.lookAt(v.position.x,0,v.position.z);
    } else {
      const back=8,up=4;
      const tx=v.position.x+Math.sin(ry)*back, tz=v.position.z+Math.cos(ry)*back;
      cam.position.x=lerp(cam.position.x,tx,0.08); cam.position.z=lerp(cam.position.z,tz,0.08);
      cam.position.y=lerp(cam.position.y,v.position.y+up,0.1);
      cam.lookAt(v.position.x,v.position.y+1,v.position.z);
      const targetFov=60+ (Math.abs(v.userData.speed)/v.userData.maxSpeed)*15;
      cam.fov=lerp(cam.fov,targetFov,0.05); cam.updateProjectionMatrix();
    }
  } else {
    const p=G.player.mesh.position;
    const target=new THREE.Vector3(p.x,p.y+1.6,p.z);
    if(G.cameraMode===2){ cam.position.set(p.x,30,p.z+0.1); cam.lookAt(p.x,0,p.z); return; }
    let theta=G.camOrbit.theta, phi=G.camOrbit.phi, dist=G.aiming?3:G.camOrbit.dist;
    if(G.cameraMode===3){ theta=performance.now()*0.0005; dist=12; }
    let cx=target.x+Math.sin(theta)*Math.cos(phi)*dist;
    let cy=target.y+Math.sin(phi)*dist;
    let cz=target.z+Math.cos(theta)*Math.cos(phi)*dist;
    if(G.aiming){ // over shoulder
      cx+=Math.cos(theta)*1.2; cz-=Math.sin(theta)*1.2; cy+=0.3;
    }
    // camera collision raycast
    const dir=new THREE.Vector3(cx-target.x,cy-target.y,cz-target.z);
    const len=dir.length(); dir.normalize();
    G._ray=G._ray||new THREE.Raycaster();
    G._ray.set(target,dir); G._ray.far=len;
    const hits=G._ray.intersectObjects(G.buildings,true);
    let useLen=len;
    if(hits.length){ useLen=Math.max(1.5,hits[0].distance-0.3); }
    cam.position.x=lerp(cam.position.x,target.x+dir.x*useLen,0.2);
    cam.position.y=lerp(cam.position.y,target.y+dir.y*useLen,0.2);
    cam.position.z=lerp(cam.position.z,target.z+dir.z*useLen,0.2);
    cam.lookAt(target);
    cam.fov=lerp(cam.fov,60,0.1); cam.updateProjectionMatrix();
    // player faces camera direction when aiming/moving
    if(G.aiming){ G.player.rotY=theta+Math.PI; }
  }
}

// =================== PLAYER UPDATE ===================
function updatePlayer(dt,t){
  const pl=G.player;
  if(pl.fireCD>0) pl.fireCD-=dt;
  if(pl.invuln>0) pl.invuln-=dt;
  // auto fire
  if(G.mouse.down && WEAPONS[pl.weapon].auto) firePrimary();
  if(pl.inVehicle){ updateVehiclePlayer(dt); return; }

  let moveX=0,moveZ=0;
  const camTheta=G.camOrbit.theta;
  // movement relative to camera
  let fwd=0,strafe=0;
  if(keys['w']) fwd+=1; if(keys['s']) fwd-=1; if(keys['a']) strafe-=1; if(keys['d']) strafe+=1;
  if(touch.move.active){ fwd+=-touch.move.y; strafe+=touch.move.x; }
  pl.running=keys['shift'];
  const speed=(pl.running?6:3);
  if(fwd||strafe){
    const ang=camTheta+Math.atan2(strafe,fwd)+Math.PI;
    moveX=Math.sin(ang); moveZ=Math.cos(ang);
    if(!G.aiming) pl.rotY=ang;
    pl.footTimer-=dt; if(pl.footTimer<=0){ G.audio.footstep(); pl.footTimer=pl.running?0.25:0.35; }
  }
  const moving=(fwd||strafe)!==0;
  // jump
  if(keys[' ']&&pl.onGround){ pl.vy=8; pl.onGround=false; }
  pl.vy-=20*dt;
  let ny=pl.mesh.position.y+pl.vy*dt;
  if(ny<=0){ if(!pl.onGround && pl.vy<-15){ damagePlayer((-pl.vy-15)*1.5); } ny=0; pl.vy=0; pl.onGround=true; }
  const nx=pl.mesh.position.x+moveX*speed*dt;
  const nz=pl.mesh.position.z+moveZ*speed*dt;
  const col=collideCircle(nx,nz,0.4);
  pl.mesh.position.set(col.x,ny,col.z);
  pl.mesh.rotation.y=pl.rotY;
  pl.walkPhase+=dt;
  animateHumanoid(pl.mesh,pl.walkPhase,moving,pl.running);
}

function updateVehiclePlayer(dt){
  const v=G.player.inVehicle; const ud=v.userData;
  let accel=0;
  if(keys['w']) accel+=1; if(keys['s']) accel-=1;
  if(touch.move.active) accel+=-touch.move.y;
  let steer=0;
  if(keys['a']) steer+=1; if(keys['d']) steer-=1;
  if(touch.move.active) steer-=touch.move.x;
  const handbrake=keys[' '];
  const maxS=ud.maxSpeed;
  // accelerate
  ud.speed+=accel*maxS*1.2*dt;
  ud.speed=clamp(ud.speed,-maxS*0.5,maxS);
  // friction
  let fr=0.99;
  if(accel===0) fr=0.96;
  if(keys['s']&&ud.speed>0) fr=0.90;
  if(handbrake) fr=0.85;
  ud.speed*=fr;
  if(Math.abs(ud.speed)<0.1) ud.speed=0;
  // steer (tighter at speed but capped)
  const steerRate=2.2*(1-Math.abs(ud.speed)/maxS*0.5);
  if(Math.abs(ud.speed)>0.5){ v.rotation.y+=steer*steerRate*dt*(ud.speed>0?1:-1); }
  ud.steer=steer;
  // drift on handbrake
  if(handbrake&&Math.abs(ud.speed)>8){ ud.drift=lerp(ud.drift,steer*0.6,0.1); G.particles.spawn(v.position.x,0.1,v.position.z,'dust'); }
  else ud.drift=lerp(ud.drift,0,0.1);
  // move
  const ry=v.rotation.y;
  const fx=-Math.sin(ry), fz=-Math.cos(ry);
  let nx=v.position.x+fx*ud.speed*dt;
  let nz=v.position.z+fz*ud.speed*dt;
  // drift sideways
  nx+=Math.cos(ry)*ud.drift*ud.speed*dt; nz+=-Math.sin(ry)*ud.drift*ud.speed*dt;
  // collision
  const col=collideCircle(nx,nz,Math.max(ud.W,ud.L)/2);
  if(col.hit){ if(Math.abs(ud.speed)>15){ damageVehicle(v,(Math.abs(ud.speed)-15)*1.5); damagePlayer(Math.abs(ud.speed)*0.2); G.particles.burst(v.position.x,1,v.position.z,'spark',6);} ud.speed*=-0.3; }
  v.position.x=col.x; v.position.z=col.z;
  // suspension via ground (flat) + body roll/pitch
  v.position.y=lerp(v.position.y,ud.wr+0.1 + (isOnOverpass(v.position.x,v.position.z)?10:0),0.2);
  v.rotation.z=lerp(v.rotation.z,-steer*0.07*(ud.speed/maxS),0.15); // roll
  v.rotation.x=lerp(v.rotation.x,-accel*0.05,0.15); // pitch
  // wheels
  ud.wheels.forEach((w,i)=>{ w.rotation.x+=ud.speed*dt; if(i<2&&!ud.vtype.moto) w.rotation.y=steer*0.4; });
  // moto lean
  if(ud.vtype.moto){ v.rotation.z=lerp(v.rotation.z,-steer*0.26,0.1); }
  // engine + speed HUD
  G.audio.setEngine(ud.speed,maxS);
  UI.speed.textContent=Math.round(Math.abs(ud.speed)*2.23)+' MPH';
  // pay-n-spray
  if(G.wanted>0){ for(const ps of G.paySpray){ if(Math.hypot(ps.x-v.position.x,ps.z-v.position.z)<5){ clearWanted(); v.userData.health=100; v.userData.onFire=false; v.userData.smoking=false; toast('RESPRAYED — wanted cleared'); }}}
}
function isOnOverpass(x,z){
  // diagonal overpass: along line z=x (rotated 45). width 30 at height 10
  const d=Math.abs(x-z)/Math.SQRT2;
  return d<15 && Math.abs(x+z)<G.CITY*0.6;
}

// =================== VEHICLE AI ===================
function updateVehicles(dt){
  const px=G.player.mesh.position.x, pz=G.player.mesh.position.z;
  G.vehicles.forEach(v=>{
    const ud=v.userData;
    if(ud.isPlayer) return;
    if(ud.burned){ return; }
    updateVehicleFire(v,dt);
    if(ud.despawnTimer>0){ ud.despawnTimer-=dt; if(ud.despawnTimer<=0 && Math.hypot(v.position.x-px,v.position.z-pz)>40){ removeVehicle(v); return; } }
    if(ud.aiState==='traffic'){
      // simple forward drive with wrapping
      const ry=v.rotation.y; const fx=-Math.sin(ry),fz=-Math.cos(ry);
      // brake if vehicle ahead
      let brake=false;
      // move
      v.position.x+=fx*ud.speed*dt; v.position.z+=fz*ud.speed*dt;
      ud.wheels.forEach(w=>w.rotation.x+=ud.speed*dt);
      // turn at grid occasionally / keep in bounds
      const lim=G.CITY/2;
      if(Math.abs(v.position.x)>lim||Math.abs(v.position.z)>lim){ v.rotation.y+=Math.PI; }
    }
  });
  updatePolice(dt);
}
function updateVehicleFire(v,dt){
  const ud=v.userData;
  if(ud.smoking && !ud.onFire){ if(Math.random()<0.3) G.particles.spawn(v.position.x,1.5,v.position.z,'smoke'); }
  if(ud.onFire){
    ud.fireTimer+=dt;
    if(Math.random()<0.6) G.particles.spawn(v.position.x+rand(-1,1),1.5,v.position.z+rand(-1,1),'fire');
    if(ud.fireTimer>3){
      createExplosion(v.position.x,1,v.position.z,10,40);
      ud.burned=true; ud.onFire=false;
      // turn black
      v.traverse(o=>{ if(o.isMesh) o.material=new THREE.MeshStandardMaterial({color:0x111111,roughness:1}); });
      addWanted(1);
    }
  }
}
function removeVehicle(v){
  G.scene.remove(v); const i=G.vehicles.indexOf(v); if(i>=0) G.vehicles.splice(i,1);
}
function updatePolice(dt){
  const p=G.player.inVehicle?G.player.inVehicle.position:G.player.mesh.position;
  G.police.forEach(v=>{
    const ud=v.userData;
    updateVehicleFire(v,dt);
    if(ud.burned) return;
    // lightbar flash
    if(ud.lb1){ const f=Math.floor(performance.now()/200)%2; ud.lb1.material.emissiveIntensity=f?2:0.2; ud.lb2.material.emissiveIntensity=f?0.2:2; }
    // seek player
    const dx=p.x-v.position.x, dz=p.z-v.position.z; const dist=Math.hypot(dx,dz);
    const targetAng=Math.atan2(-dx,-dz);
    let da=targetAng - v.rotation.y; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
    v.rotation.y+=clamp(da,-2*dt,2*dt);
    if(dist>6){ ud.speed=lerp(ud.speed,ud.maxSpeed*0.7,0.05); }
    else { ud.speed=lerp(ud.speed,0,0.1); }
    const ry=v.rotation.y;
    const nx=v.position.x-Math.sin(ry)*ud.speed*dt, nz=v.position.z-Math.cos(ry)*ud.speed*dt;
    const col=collideCircle(nx,nz,2); v.position.x=col.x; v.position.z=col.z;
    v.position.y=ud.wr+0.1;
    ud.wheels.forEach(w=>w.rotation.x+=ud.speed*dt);
    // arrest / shoot
    if(dist<1.5 && !G.player.inVehicle){ ud.arrestTimer+=dt; if(ud.arrestTimer>3){ arrestPlayer(); } }
    else ud.arrestTimer=0;
    if(G.wanted>=2 && dist<40 && Math.random()<0.02){ // shoot at player
      damagePlayer(rand(3,8)); G.audio.gunshot('pistol');
    }
  });
}
function arrestPlayer(){
  G.money=Math.max(0,G.money-100); clearWanted();
  G.player.weapon='fists';
  toast('BUSTED — $100 fine');
  // respawn at hospital
  let best=G.hospitals[0],bd=1e9;
  G.hospitals.forEach(h=>{const d=Math.hypot(h.x-G.player.mesh.position.x,h.z-G.player.mesh.position.z);if(d<bd){bd=d;best=h;}});
  G.player.mesh.position.set(best.x,0,best.z); G.player.hp=100;
}

// =================== PEDS UPDATE ===================
function updatePeds(dt,t){
  const px=G.player.mesh.position.x, pz=G.player.mesh.position.z;
  G.peds.forEach((pe,i)=>{
    if(pe.dead) return;
    const d=Math.hypot(pe.mesh.position.x-px,pe.mesh.position.z-pz);
    if(d>200){ // respawn at edge
      const wp=randWaypointNear(px,pz,140); pe.mesh.position.set(wp.x,0,wp.z); pe.state='wander'; pe.target=randWaypoint(); return;
    }
    pe.phase+=dt;
    let tx,tz,spd=pe.speed,moving=true,flail=false;
    if(pe.state==='wander'){
      if(pe.pauseT>0){ pe.pauseT-=dt; moving=false; }
      else {
        tx=pe.target.x; tz=pe.target.z;
        const dd=Math.hypot(tx-pe.mesh.position.x,tz-pe.mesh.position.z);
        if(dd<2){ pe.pauseT=rand(2,5); pe.target=randWaypoint(); moving=false; }
      }
    } else if(pe.state==='flee'){
      flail=true; spd=pe.speed*1.5;
      tx=pe.mesh.position.x+Math.cos(pe.fleeDir)*10; tz=pe.mesh.position.z+Math.sin(pe.fleeDir)*10;
      // flee away from player
      const aw=Math.atan2(pe.mesh.position.z-pz,pe.mesh.position.x-px); pe.fleeDir=lerp(pe.fleeDir,aw,0.1);
      tx=pe.mesh.position.x+Math.cos(pe.fleeDir)*10; tz=pe.mesh.position.z+Math.sin(pe.fleeDir)*10;
      if(d>60) pe.state='wander';
    } else if(pe.state==='panic'){
      moving=false; pe.pauseT-=dt; if(pe.pauseT<=0){ pe.state='flee'; pe.fleeDir=rand(0,TAU); }
    } else if(pe.state==='combat'){
      // approach and shoot player
      tx=px; tz=pz; spd=pe.speed*1.2;
      if(d<25 && Math.random()<0.01){ damagePlayer(rand(2,6)); }
      if(d>3 === false){ moving=false; }
    }
    if(moving && tx!==undefined){
      const ang=Math.atan2(tz-pe.mesh.position.z,tx-pe.mesh.position.x);
      const nx=pe.mesh.position.x+Math.cos(ang)*spd*dt;
      const nz=pe.mesh.position.z+Math.sin(ang)*spd*dt;
      const col=collideCircle(nx,nz,0.4);
      pe.mesh.position.x=col.x; pe.mesh.position.z=col.z;
      pe.mesh.rotation.y=-ang+Math.PI/2;
    }
    if(flail) flailHumanoid(pe.mesh,pe.phase);
    else animateHumanoid(pe.mesh,pe.phase,moving,pe.state==='flee');
    // run over by player vehicle
    if(G.player.inVehicle){ const v=G.player.inVehicle; if(Math.hypot(v.position.x-pe.mesh.position.x,v.position.z-pe.mesh.position.z)<2 && Math.abs(v.userData.speed)>8){ killPed(pe); addWanted(1); G.particles.burst(pe.mesh.position.x,1,pe.mesh.position.z,'spark',5); }}
  });
}
function randWaypointNear(px,pz,r){
  const a=rand(0,TAU); return {x:px+Math.cos(a)*r,z:pz+Math.sin(a)*r};
}

// =================== BULLETS / PROJECTILES ===================
function updateBullets(dt){
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i]; b.life-=dt;
    b.vy-= (b.type==='rocket'?0:20)*dt;
    b.mesh.position.x+=b.vx*dt; b.mesh.position.y+=b.vy*dt; b.mesh.position.z+=b.vz*dt;
    if(b.type==='rocket'){ G.particles.spawn(b.mesh.position.x,b.mesh.position.y,b.mesh.position.z,'smoke');
      const dir=new THREE.Vector3(b.vx,b.vy,b.vz); b.mesh.lookAt(b.mesh.position.clone().add(dir)); }
    let explode=false;
    if(b.mesh.position.y<=0){
      if(b.type==='rocket'){ explode=true; }
      else if(b.type==='molotov'){ createFireZone(b.mesh.position.x,b.mesh.position.z); G.scene.remove(b.mesh); G.bullets.splice(i,1); continue; }
      else if(b.type==='grenade'){ if(b.bounce){ b.vy=-b.vy*0.4; b.vx*=0.6; b.vz*=0.6; b.mesh.position.y=0.1; } }
    }
    // proximity explode rocket
    if(b.type==='rocket'){
      for(const v of G.vehicles.concat(G.police)){ if(Math.hypot(v.position.x-b.mesh.position.x,v.position.z-b.mesh.position.z)<2.5){ explode=true; break; } }
      for(const pe of G.peds){ if(!pe.dead&&Math.hypot(pe.mesh.position.x-b.mesh.position.x,pe.mesh.position.z-b.mesh.position.z)<2){ explode=true; break; } }
    }
    if(b.life<=0){ if(b.type==='rocket'||b.type==='grenade') explode=true; }
    if(explode){ createExplosion(b.mesh.position.x,Math.max(0.5,b.mesh.position.y),b.mesh.position.z,b.type==='grenade'?8:15,80); G.scene.remove(b.mesh); G.bullets.splice(i,1); continue; }
    if(b.life<=0){ G.scene.remove(b.mesh); G.bullets.splice(i,1); }
  }
}
const fireZones=[];
function createFireZone(x,z){
  fireZones.push({x,z,t:5});
}
function updateFireZones(dt){
  for(let i=fireZones.length-1;i>=0;i--){
    const f=fireZones[i]; f.t-=dt;
    for(let k=0;k<3;k++) G.particles.spawn(f.x+rand(-2.5,2.5),0.3,f.z+rand(-2.5,2.5),'fire');
    // damage
    const p=G.player.mesh.position; if(Math.hypot(p.x-f.x,p.z-f.z)<5) damagePlayer(3);
    G.peds.forEach(pe=>{ if(!pe.dead&&Math.hypot(pe.mesh.position.x-f.x,pe.mesh.position.z-f.z)<5){ pe.hp-=3; if(pe.hp<=0)killPed(pe); }});
    if(f.t<=0) fireZones.splice(i,1);
  }
}

// =================== DAY/NIGHT & SKY ===================
function updateDayNight(dt){
  G.time+=dt*(86400/G.dayLength);
  if(G.time>86400) G.time-=86400;
  const dayFrac=G.time/86400; // 0..1
  // sun angle
  const sunAngle=(dayFrac-0.25)*TAU; // noon at 0.5
  const sx=Math.cos(sunAngle)*300, sy=Math.sin(sunAngle)*300+50, sz=100;
  G.sun.position.set(sx,Math.max(10,sy),sz);
  // color/intensity by time
  let col,inten,sky,amb;
  const hour=G.time/3600;
  if(hour<5||hour>21){ col=new THREE.Color(0x0a0a1a); inten=0.15; sky=new THREE.Color(0x0a0a25); amb=0.2; }
  else if(hour<7){ col=new THREE.Color(0xFF8C42); inten=0.7; sky=new THREE.Color(0xcc7744); amb=0.35; }
  else if(hour<17){ col=new THREE.Color(0xFFFFF0); inten=1.2; sky=new THREE.Color(0x87b8d8); amb=0.4; }
  else if(hour<19){ col=new THREE.Color(0xFF4500); inten=0.8; sky=new THREE.Color(0xc85a30); amb=0.35; }
  else { col=new THREE.Color(0x4a3a5a); inten=0.4; sky=new THREE.Color(0x3a3050); amb=0.25; }
  G.sun.color.lerp(col,0.05); G.sun.intensity=lerp(G.sun.intensity,inten,0.05);
  G.ambient.intensity=lerp(G.ambient.intensity,amb,0.05);
  G.scene.fog.color.lerp(sky,0.05);
  if(G.skyMat){ G.skyMat.uniforms.topColor.value.lerp(sky,0.05); }
  // building windows at night
  const night=(hour<6||hour>19);
  G.buildings.forEach(b=>{ if(b.userData.winMat) b.userData.winMat.emissiveIntensity=night?0.8:0; if(b.userData.beacon) b.userData.beacon.material.emissiveIntensity=night?3:1; });
}

// =================== TRAFFIC LIGHTS ===================
function updateTrafficLights(dt){
  G.trafficLights.forEach(tl=>{
    tl.phase=(tl.phase+dt)%9;
    let r=0,y=0,g=0;
    if(tl.phase<4){ r=1; } else if(tl.phase<8){ g=1; } else { y=1; }
    tl.red.material.emissiveIntensity=r; tl.green.material.emissiveIntensity=g; tl.yellow.material.emissiveIntensity=y;
  });
}

// =================== PICKUPS UPDATE ===================
function updatePickups(dt){
  const p=G.player.mesh.position;
  for(let i=G.pickups.length-1;i>=0;i--){
    const pk=G.pickups[i]; pk.t+=dt;
    pk.mesh.rotation.y+=dt*2; pk.mesh.position.y=1+Math.sin(pk.t*3)*0.2;
    pk.light.intensity=1+Math.sin(pk.t*4)*0.5;
    if(Math.hypot(pk.x-p.x,pk.z-p.z)<1.5 && !G.player.inVehicle){
      if(pk.kind==='armor') G.player.armor=100;
      else if(pk.kind==='health') G.player.hp=Math.min(100,G.player.hp+25);
      else giveWeapon(pk.kind);
      G.audio.jingle(); toast('Picked up '+(WEAPONS[pk.kind]?WEAPONS[pk.kind].name:pk.kind));
      G.scene.remove(pk.mesh); G.scene.remove(pk.light); G.pickups.splice(i,1);
    }
  }
}

// =================== INTERACTIONS / PROMPTS ===================
function updatePrompts(){
  if(G.paused||shopOpen) return;
  const p=G.player.mesh.position; let prompt='';
  if(G.player.inVehicle){ prompt='Press F to exit'; }
  else {
    const v=nearestVehicle(3); if(v) prompt='Press F to enter '+v.userData.name;
    for(const s of G.shops){ if(Math.hypot(s.x-p.x,s.z-p.z)<4){ prompt='Press E — '+s.name; } }
    for(const s of G.safehouses){ if(Math.hypot(s.x-p.x,s.z-p.z)<5){ prompt='Press E to save game'; } }
  }
  // mission markers
  for(const mm of missionMarkers){
    if(mm.done) continue;
    mm.mk.rotation.y+=0.02;
    if(Math.hypot(mm.x-p.x,mm.z-p.z)<3 && (!G.mission)){
      prompt='Press E — Mission: '+mm.mission.name;
      if(G.mission&&G.mission.state==='briefing') {}
      // briefing on E handled in tryInteract -> but we set up briefing here
      if(keys['e']&&!G.mission){ G.mission={def:mm.mission,state:'briefing'}; showObjective('['+mm.mission.name+'] '+mm.mission.brief+' — Press ENTER'); }
    }
  }
  showPrompt(prompt);
}

// =================== WANTED DECAY ===================
function updateWanted(dt){
  if(G.wantedGainFlash>0) G.wantedGainFlash-=dt;
  if(G.wanted<=0){ G.audio.stopSiren(); return; }
  // line of sight: any police near with clear path
  const p=G.player.inVehicle?G.player.inVehicle.position:G.player.mesh.position;
  let seen=false;
  G.police.forEach(v=>{ if(!v.userData.burned && Math.hypot(v.position.x-p.x,v.position.z-p.z)<80) seen=true; });
  if(seen){ G.lastSeenTimer=0; } else { G.lastSeenTimer+=dt; if(G.lastSeenTimer>12){ G.wanted=Math.max(0,G.wanted-0.05*dt); }}
  ensurePolice();
  if(G.wanted===0) clearWanted();
}

// =================== WATER ANIMATION ===================
function updateWater(t){
  if(!G.water) return;
  const pos=G.water.geometry.attributes.position; const base=G.water.userData.base;
  for(let i=0;i<pos.count;i++){
    const x=base[i*3], y=base[i*3+1];
    pos.setZ(i, Math.sin(x*0.1+t)*0.5+Math.cos(y*0.1+t*0.7)*0.5);
  }
  pos.needsUpdate=true;
}

// =================== FOUNTAIN SPRAY ===================
function updateFountain(){
  if(G.fountain && Math.random()<0.5){ G.particles.spawn(G.fountain.x,2,G.fountain.z,'water'); }
}

// =================== BIG MAP ===================
function drawBigMap(){
  const c=document.getElementById('bigmap').getContext('2d'); const S=500;
  c.fillStyle='#243024'; c.fillRect(0,0,S,S);
  const scale=S/(G.CITY+60); const off=S/2;
  function tx(x,z){ return [off+x*scale, off+z*scale]; }
  const half=G.CITY/2, offset=-half+CELL/2;
  c.strokeStyle='#555'; c.lineWidth=2;
  for(let i=0;i<=GRID;i++){ const gx=offset-CELL/2+i*CELL; let a=tx(gx,-half),b=tx(gx,half); c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke(); let c2=tx(-half,gx),d=tx(half,gx);c.beginPath();c.moveTo(c2[0],c2[1]);c.lineTo(d[0],d[1]);c.stroke(); }
  c.fillStyle='#1a1a22'; G.buildingAABBs.forEach(b=>{ const p=tx((b.minX+b.maxX)/2,(b.minZ+b.maxZ)/2); c.fillRect(p[0]-1,p[1]-1,2,2); });
  c.fillStyle='#ff44cc'; missionMarkers.forEach(m=>{ if(!m.done){const p=tx(m.x,m.z);c.beginPath();c.arc(p[0],p[1],4,0,TAU);c.fill();}});
  c.fillStyle='#44ff88'; G.paySpray.forEach(s=>{const p=tx(s.x,s.z);c.fillRect(p[0]-3,p[1]-3,6,6);});
  const pp=tx(G.player.mesh.position.x,G.player.mesh.position.z); c.fillStyle='#fff'; c.beginPath();c.arc(pp[0],pp[1],5,0,TAU);c.fill();
}

// =================== MAIN LOOP ===================
let lastTime=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastTime)/1000; lastTime=now;
  if(dt>0.05) dt=0.05; // cap (tunneling guard / fixed-ish step)
  // fps
  G.fpsFrames++; G.fpsAccum+=dt;
  if(G.fpsAccum>=0.5){ G.fpsDisplay=Math.round(G.fpsFrames/G.fpsAccum); G.fpsFrames=0; G.fpsAccum=0; UI.fps.textContent='FPS '+G.fpsDisplay; }

  if(G.started && !G.paused && !shopOpen){
    const sdt=dt*G.timeScale;
    const t=now/1000;
    updatePlayer(sdt,t);
    updateCamera(sdt);
    updateVehicles(sdt);
    updatePeds(sdt,t);
    updateBullets(sdt);
    updateFireZones(sdt);
    updatePickups(sdt);
    updateMission(sdt);
    updateWanted(sdt);
    updateDayNight(sdt);
    updateTrafficLights(sdt);
    updateWater(t);
    updateFountain();
    G.particles.update(sdt);
    G.audio.updateSiren(sdt);
    // explosion lights
    for(let i=G.explosions.length-1;i>=0;i--){ const e=G.explosions[i]; e.t+=sdt; e.light.intensity=Math.max(0,8-e.t*16); if(e.t>0.5){ G.scene.remove(e.light); G.explosions.splice(i,1); } }
    // aiming crosshair
    UI.crosshair.style.display=(G.aiming||G.lockTarget)?'block':'none';
    UI.crosshair.className=G.lockTarget?'locked':'';
    updatePrompts();
    // wanted star flash timer reset
    updateHUD(); drawMinimap();
    // fade timers
    if(G.toastTimer>0){ G.toastTimer-=dt; if(G.toastTimer<=0) UI.toast.style.opacity=0; }
    if(G.bigmsgTimer>0){ G.bigmsgTimer-=dt; if(G.bigmsgTimer<=0) UI.bigmsg.style.opacity=0; }
    if(G.vehNameTimer>0){ G.vehNameTimer-=dt; if(G.vehNameTimer<=0){ UI.vehName.style.opacity=0; if(!G.player.inVehicle) UI.speed.style.opacity=0; } }
    if(!G.player.inVehicle && G.vehNameTimer<=0) UI.speed.style.opacity=0;
    // damage flash decay
    const cur=parseFloat(UI.dmgFlash.style.opacity)||0; if(cur>0) UI.dmgFlash.style.opacity=Math.max(0,cur-dt*1.5);
  }
  if(G.renderer) G.renderer.render(G.scene,G.camera);
}

// =================== INIT ===================
function initThree(){
  G.scene=new THREE.Scene();
  G.scene.fog=new THREE.FogExp2(0xC8A882,0.008);
  G.camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,2000);
  G.camera.position.set(0,10,20);
  G.renderer=new THREE.WebGLRenderer({antialias:true});
  G.renderer.setSize(innerWidth,innerHeight);
  G.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  G.renderer.shadowMap.enabled=true; G.renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  G.renderer.toneMapping=THREE.ACESFilmicToneMapping; G.renderer.toneMappingExposure=1.0;
  document.getElementById('game').appendChild(G.renderer.domElement);

  G.ambient=new THREE.AmbientLight(0x404060,0.4); G.scene.add(G.ambient);
  G.sun=new THREE.DirectionalLight(0xFFF5E0,1.2); G.sun.position.set(200,300,100);
  G.sun.castShadow=true; G.sun.shadow.mapSize.set(2048,2048);
  G.sun.shadow.camera.left=-250; G.sun.shadow.camera.right=250;
  G.sun.shadow.camera.top=250; G.sun.shadow.camera.bottom=-250;
  G.sun.shadow.camera.near=1; G.sun.shadow.camera.far=800;
  G.scene.add(G.sun); G.scene.add(G.sun.target);

  // sky dome
  const skyGeo=new THREE.SphereGeometry(900,32,16);
  G.skyMat=new THREE.ShaderMaterial({
    uniforms:{topColor:{value:new THREE.Color(0x87b8d8)},bottomColor:{value:new THREE.Color(0xC8A882)}},
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vP;
      void main(){ float h=normalize(vP).y*0.5+0.5; gl_FragColor=vec4(mix(bottomColor,topColor,h),1.0);}`,
    side:THREE.BackSide,fog:false
  });
  G.scene.add(new THREE.Mesh(skyGeo,G.skyMat));

  G.particles=new ParticleSystem(G.scene,400);
  window.addEventListener('resize',()=>{ G.camera.aspect=innerWidth/innerHeight; G.camera.updateProjectionMatrix(); G.renderer.setSize(innerWidth,innerHeight); });
}

// Loading orchestration
function startLoading(){
  initThree();
  G.audio=new AudioEngine();
  const gen=generateWorld();
  const bar=document.getElementById('bar'), msg=document.getElementById('loadMsg');
  let step=0; const totalSteps=16;
  function tick(){
    const r=gen.next();
    if(!r.done){
      step++; bar.style.width=Math.min(95,step/totalSteps*100)+'%'; msg.textContent=r.value;
      // render a frame so screen isn't frozen
      setTimeout(tick,16);
    } else {
      // finish: create entities
      createPlayer(); spawnTraffic(); spawnPeds(); spawnInitialPickups(); placeMissionMarkers();
      drawPortrait();
      bar.style.width='100%'; msg.textContent='READY';
      document.getElementById('startBtn').style.display='block';
    }
  }
  tick();
}

document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('loader').style.display='none';
  G.started=true; G.audio.init();
  // try load save
  // (left manual: player can save at safehouse)
  gameDiv.requestPointerLock&&gameDiv.requestPointerLock();
});

// boot
window.addEventListener('load',()=>{ try{ startLoading(); requestAnimationFrame(loop);}catch(e){ document.getElementById('loadMsg').textContent='ERROR: '+e.message; console.error(e);} });
</script>
